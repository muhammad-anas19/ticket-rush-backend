# TicketRush — containerised infrastructure.
#
#   docker compose up -d        from this folder (backend/)
#   docker compose ps
#   docker compose down         stops everything, KEEPS your data
#   docker compose down -v      also deletes the volumes — deliberate, no undo
#
# What is NOT here, and why:
#
#   Postgres — runs natively on this machine (PostgreSQL 18, port 5432), managed with
#              pgAdmin. See TR-DEC-015 for the tradeoff that choice makes.
#
#   The API  — runs on the host with `npm run start:dev`. Faster reload, a real debugger,
#              and no bind-mount filesystem bridge in the way.
#
# An explicit project name. Without it, Compose derives one from the containing DIRECTORY —
# which here would be "backend", and every volume would be named `backend_redis_data`.
# Rename or move the folder and Compose silently creates a fresh set of volumes, leaving the
# old data orphaned and looking for all the world like the database wiped itself.
name: ticketrush

services:
  redis:
    image: redis:7-alpine
    container_name: ticketrush-redis
    restart: unless-stopped
    # appendonly survives restarts. Not strictly required — TR-DEC-007 makes Redis
    # authoritative for nothing, so everything in it can be rebuilt from Postgres — but it
    # makes local restarts less irritating.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # host:container. Nothing else is on 6379 locally, so no shift is needed.
      - '6379:6379'
    volumes:
      # Named volume, not a bind mount: Docker-managed, correct permissions, native speed.
      # Bind-mounting a datastore's files on Windows is a known source of slowness and
      # occasional corruption.
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # A GUI purely for LOOKING at what's in Redis during M4 — browse keys, inspect a hold's TTL
  # counting down in real time, watch `cache:event:*` keys appear and vanish on invalidation.
  # Not something the app depends on; RabbitMQ already ships an equivalent (the `-management`
  # image variant below) but no comparable all-in-one Redis image exists, so this is a second
  # container rather than a second command flag.
  redisinsight:
    image: redis/redisinsight:latest
    container_name: ticketrush-redisinsight
    restart: unless-stopped
    ports:
      - '5540:5540' # web UI — http://localhost:5540
    volumes:
      # Persists saved connections/settings only. Nothing here is Redis DATA — that stays in
      # `redis_data` above — so wiping this volume loses zero application state.
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    # No healthcheck. Confirmed the app itself binds `0.0.0.0:5540` (via `netstat` inside the
    # container) and answers `/api/health` correctly both from the host and from the container's
    # own bridge IP — but a probe run from INSIDE the container against `127.0.0.1:5540`
    # (the only address a static Compose healthcheck can target) gets refused regardless of how
    # long it waits. Whatever the image does internally to reject its own loopback, a healthcheck
    # here would report "unhealthy" forever on a container that works fine — worse than no check
    # at all. Nothing else in this stack depends on this one being healthy to start, so there is
    # nothing this would have protected.

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ticketrush-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ticketrush}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ticketrush}
    ports:
      - '5672:5672'   # AMQP — what the app connects to
      - '15672:15672' # management UI — http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      # RabbitMQ genuinely is slow to boot. Without a start_period its own healthcheck fails
      # while it is still starting and burns through the retries before it is ready.
      start_period: 30s

volumes:
  redis_data:
  redisinsight_data:
  rabbitmq_data:
